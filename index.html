<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive lead generation campaign calculator." />
    <title>Lead Predictor</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Campaign settings">
        <a class="brand" href="#dashboard" aria-label="Lead Predictor home">
          <span class="brand-mark" aria-hidden="true">▾</span><span>Lead<span>Predictor</span></span>
        </a>

        <form id="predictor-form" class="settings-card" novalidate>
          <h1 class="visually-hidden">Lead Predictor campaign settings</h1>
          <div class="field-group">
            <label for="language" data-i18n="language">Language</label>
            <select id="language" name="language">
              <option value="en">🇺🇸 English</option>
              <option value="bg">🇧🇬 Български</option>
            </select>
          </div>
          <div class="field-group">
            <label for="currency" data-i18n="currency">Currency</label>
            <select id="currency" name="currency">
              <option value="USD">$ US Dollar</option>
              <option value="EUR">€ Euro</option>
              <option value="BGN">лв Bulgarian Lev</option>
            </select>
          </div>
          <div class="field-group">
            <label for="campaign-start" data-i18n="campaignStart">Campaign Start</label>
            <input id="campaign-start" name="campaign-start" type="date" value="2026-05-08" required />
          </div>
          <div class="field-group">
            <label for="campaign-end" data-i18n="campaignEnd">Campaign End</label>
            <input id="campaign-end" name="campaign-end" type="date" value="2026-11-04" required />
          </div>
          <div class="field-group">
            <label for="total-revenue" data-i18n="totalRevenue">Total Revenue</label>
            <div class="input-with-symbol"><span aria-hidden="true" class="currency-symbol">$</span><input id="total-revenue" name="total-revenue" inputmode="decimal" type="number" min="0.01" step="0.01" value="10000" required /></div>
          </div>
          <div class="field-group">
            <label for="average-order" data-i18n="averageOrder">Avg. Order Value</label>
            <div class="input-with-symbol"><span aria-hidden="true" class="currency-symbol">$</span><input id="average-order" name="average-order" inputmode="decimal" type="number" min="0.01" step="0.01" value="1000" required /></div>
          </div>
          <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
        </form>
      </aside>

      <section id="dashboard" class="dashboard" aria-label="Lead prediction dashboard">
        <section class="overview-panel" aria-label="Monthly forecast and funnel results">
          <div class="chart-area">
            <div class="section-heading"><p data-i18n="monthlyForecast">Monthly funnel forecast</p><span id="chart-period"></span></div>
            <div id="chart" class="bar-chart" role="img" aria-label="Monthly funnel forecast chart"></div>
            <div id="chart-tooltip" class="chart-tooltip" role="status" aria-live="polite" hidden></div>
          </div>
          <section class="result-cards" aria-label="Prediction results">
            <article class="result-card prospects-card">
              <div class="card-heading"><span class="card-icon" aria-hidden="true">▣</span><h2 data-i18n="prospects">Prospects</h2><strong id="prospects-percent">100%</strong></div>
              <output id="prospects-value" class="result-value">125</output>
              <div class="progress-track"><span id="prospects-progress"></span></div>
            </article>
            <article class="result-card leads-card">
              <div class="card-heading"><span class="card-icon" aria-hidden="true">♟</span><h2 data-i18n="leads">Leads</h2><strong id="leads-percent">20%</strong></div>
              <output id="leads-value" class="result-value">25</output>
              <div class="progress-track"><span id="leads-progress"></span></div>
            </article>
            <article class="result-card customers-card">
              <div class="card-heading"><span class="card-icon" aria-hidden="true">♛</span><h2 data-i18n="customers">Customers</h2><strong id="customers-percent">8%</strong></div>
              <output id="customers-value" class="result-value">10</output>
              <div class="progress-track"><span id="customers-progress"></span></div>
            </article>
          </section>
        </section>

        <section class="rates-panel" aria-label="Conversion response rates">
          <div class="range-control">
            <div class="range-label"><label for="lead-rate" data-i18n="leadResponseRate">Lead Response Rate</label><output id="lead-rate-output">40.00%</output></div>
            <input id="lead-rate" type="range" min="1" max="100" value="40" step="1" aria-describedby="lead-rate-output" />
          </div>
          <div class="range-control">
            <div class="range-label"><label for="prospect-rate" data-i18n="prospectResponseRate">Prospect Response Rate</label><output id="prospect-rate-output">20.00%</output></div>
            <input id="prospect-rate" type="range" min="1" max="100" value="20" step="1" aria-describedby="prospect-rate-output" />
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
